<section class="assets-panel">
  <div class="assets-header">
    <span class="section-title">ASSETS</span>
  </div>

  <div class="asset-search">
    <input
      type="text"
      placeholder="Search assets..."
      [(ngModel)]="searchText"
    />
  </div>

  <div class="asset-section">
    <div class="asset-section-header">
      <span class="section-chevron">▾</span>
      <span>Railway Objects</span>
    </div>

    <div class="asset-grid">
      <div
        class="asset-tile"
        *ngFor="let asset of filteredAssets"
        draggable="true"
        (dragstart)="onDragStart($event, asset)"
        (click)="selectAsset(asset)"
        [title]="asset.name"
        [ngClass]="getAssetClass(asset)"
      >
        <img [src]="asset.file" [alt]="asset.name" />
      </div>
    </div>

    <div class="empty-state" *ngIf="filteredAssets.length === 0">
      No assets found.
    </div>
  </div>

  <div class="asset-section">
    <div class="asset-section-header">
      <span class="section-chevron">▾</span>
      <span>Drawing Tools</span>
    </div>
